<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/main.css">
    <!-- <link rel="stylesheet" href="../css/home.css"> -->
    <title>Login</title>
</head>
<body>
    <h1>OptiRoster</h1>
    <h3>Login</h3>
    <div id="message-container" class="error-container specified-hidden">
        <p id="message-tag" style="color: green;"></p>
    </div>
    <p id="message-tag" class="hidden"></p>
    <div id="error-container" class="error-container specified-hidden">
        <p id="error-tag" style="color: red;"></p>
    </div>
    <div id="buttons-container">
        <button id="login-button">
            Login
        </button>
        <button id="signup-button">
            Sign Up
        </button>
    </div>
    <form id="info-container" class="hidden" autocomplete="off">
        <label for="username">Username</label>
        <input type="text" id="username" name="login-user-entry" placeholder="Type here" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other">
        <label for="password">Password</label>
        <input type="password" id="password" name="login-pass-entry" placeholder="Type here" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other">
        <button id="submit-button">Submit</button>
    </form>
    <script type="module" src="../views/login/frontend.js"></script>
    <script type="module" src="../views/login/main.js"></script>
</body>
